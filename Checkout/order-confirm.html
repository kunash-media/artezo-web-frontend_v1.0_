<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Confirmation | Artezo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(29, 60, 74, 0.12);
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hidden { display: none !important; }

    /* ── Loading State ── */
    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid #eef2f5;
      border-top-color: #1D3C4A;
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loadingState p {
      color: #1D3C4A;
      font-size: 16px;
      font-weight: 500;
    }

    /* ── Success State ── */
    .icon-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
    }
    .icon-success {
      background: #ecfdf5;
      color: #10b981;
    }
    .icon-error {
      background: #fef2f2;
      color: #ef4444;
    }

    #successState h1 {
      color: #1D3C4A;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    #successState p, #errorState p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    #orderIdDisplay {
      background: #f8fafc;
      border: 1px solid #eef2f5;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      color: #1D3C4A;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 24px !important;
    }

    #errorState h1 {
      color: #1D3C4A;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1D3C4A;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 13px 28px;
      border-radius: 10px;
      transition: background 0.2s ease, transform 0.15s ease;
      width: 100%;
    }
    .btn:hover {
      background: #E39F32;
      transform: translateY(-1px);
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #e5e7eb;
      color: #1D3C4A;
      margin-top: 10px;
    }
    .btn-outline:hover {
      background: #f8fafc;
      border-color: #1D3C4A;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="loadingState">
      <div class="spinner"></div>
      <p>Confirming your order...</p>
    </div>

    <div id="successState" class="hidden">
      <div class="icon-circle icon-success"><i class="fa-solid fa-check"></i></div>
      <h1>Order Confirmed! 🎉</h1>
      <p>Thank you for shopping with Artezo. Your order is being processed.</p>
      <p id="orderIdDisplay"></p>
      <a href="/Myorders/orders.html" class="btn"><i class="fa-solid fa-bag-shopping"></i> View My Orders</a>
    </div>

    <div id="errorState" class="hidden">
      <div class="icon-circle icon-error"><i class="fa-solid fa-exclamation"></i></div>
      <h1>Something Went Wrong</h1>
      <p id="errorMessage"></p>
      <a href="/Myorders/orders.html" class="btn">Go to My Orders</a>
      <a href="/" class="btn btn-outline">Back to Home</a>
    </div>
  </div>

  <script src="/Checkout/order-confirm.js"></script>
</body>
</html>
